<title>BreezeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: venue marketplace — search band, card grid of rendered spaces; a space opens as a full sheet (3D viewer, measured specs, layout builder, price calendar, negotiation) */
:root{
  --bg:#EDF3F2;--surface:#FFFFFF;--ink:#0F2A33;--muted:#4F6A70;--line:#CFDEDC;--ocean:#0B6F79;--ocean-soft:#D5ECEC;--sand:#EADFC8;--sand-ink:#6B5730;
  --coral:#B4442E;--coral-soft:#F7E1DB;--good:#2E7D4F;--good-soft:#DCEFE3;--warn:#8A6400;--warn-soft:#F6ECCF;--scrim:rgba(8,24,29,.6);
  --heat0:#E3EEEC;--heat1:#B8D8D6;--heat2:#6FB3B4;--heat3:#2C8A90;--heat4:#0B5F68;
  --display:"Young Serif",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A1F;--surface:#10262D;--ink:#E4EEEC;--muted:#93AAAD;--line:#22404A;--ocean:#4CC0C8;--ocean-soft:#123D44;--sand:#3A3122;--sand-ink:#E3CF9F;--coral:#F0937C;--coral-soft:#3D211B;--good:#7AD39C;--good-soft:#163525;--warn:#E8C25C;--warn-soft:#352B12;--scrim:rgba(0,0,0,.7);--heat0:#163038;--heat1:#1C4C52;--heat2:#257178;--heat3:#3398a0;--heat4:#5fd0d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1A1F;--surface:#10262D;--ink:#E4EEEC;--muted:#93AAAD;--line:#22404A;--ocean:#4CC0C8;--ocean-soft:#123D44;--sand:#3A3122;--sand-ink:#E3CF9F;--coral:#F0937C;--coral-soft:#3D211B;--good:#7AD39C;--good-soft:#163525;--warn:#E8C25C;--warn-soft:#352B12;--scrim:rgba(0,0,0,.7);--heat0:#163038;--heat1:#1C4C52;--heat2:#257178;--heat3:#3398a0;--heat4:#5fd0d6;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ocean);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{font-weight:600;font-size:14px;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:7px 13px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
.count{font-family:var(--mono);font-size:11.5px;background:var(--ocean-soft);color:var(--ocean);border-radius:999px;padding:1px 7px;margin-left:5px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,42px);line-height:1.08}h2{font-size:22px}h3{font-size:18px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--body)}
.sub{color:var(--muted);margin:0;max-width:66ch}
.search{margin:20px 0 14px;display:grid;gap:12px}
.askbox{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;flex-wrap:wrap}
.askbox:focus-within{border-color:var(--ocean)}
.askbox textarea{flex:1 1 260px;min-width:0;border:0;background:none;resize:none;font-size:16px;padding:8px 10px;min-height:54px}
.askbox textarea:focus{outline:none}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:46px;cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.btn{font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--ocean);background:var(--ocean);color:var(--surface);white-space:nowrap}
.btn.ghost{background:none;color:var(--ocean)}.btn.small{padding:6px 12px;font-size:13.5px}.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:none;border:1px dashed var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--ocean);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ocean-soft);color:var(--ocean)}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagc{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--ocean-soft);color:var(--ocean);font-weight:600;border:0}
.tagc.miss{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--coral-soft);color:var(--coral)}.note.ok{background:var(--good-soft);color:var(--good)}.note.info{background:var(--ocean-soft);color:var(--ocean)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.explore{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.explore{grid-template-columns:minmax(0,1fr)}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:880px){.filters{position:static;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
.filters label,.form label{display:grid;gap:4px;font-size:13px;font-weight:600}
input[type=number],input[type=date],input[type=text],input[type=email],select,.form textarea{font-weight:400;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.resultbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.linkbtn{background:none;border:0;color:var(--ocean);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ocean)}@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card.dim{opacity:.62}
.photo{display:block;width:100%;aspect-ratio:16/10;background:linear-gradient(110deg,var(--line) 30%,var(--ocean-soft) 50%,var(--line) 70%);background-size:200% 100%;object-fit:cover;max-width:100%}
@media (prefers-reduced-motion:no-preference){.photo.loading{animation:shimmer 1.4s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}}
.cbody{padding:12px 14px 14px;display:grid;gap:6px}
.cbody h3{font-size:18px;line-height:1.2}
.where{font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:600}
.pill.amber{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
.pill.red{background:var(--coral-soft);border-color:transparent;color:var(--coral);font-weight:600}
.pill.amber,.pill.red{white-space:normal}
.pill.idle{background:var(--sand);border-color:transparent;color:var(--sand-ink);font-weight:600}
.badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ocean);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line)}
.render{position:absolute;bottom:calc(100% - 37.5% - 28px);left:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 6px}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.heart svg{width:18px;height:18px}.heart[aria-pressed="true"] path{fill:var(--coral);stroke:var(--coral)}
.price{font-size:14px}.price b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(980px,100%);height:100%;overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 32px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet>*{flex:none}
.sheethead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.viewer{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#111}
.viewer canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;touch-action:none}
.viewer .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:3px 8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.box>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--body)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:14px}
.kv .r{text-align:right}.kv .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles label{display:flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11.5px;text-align:center;font-variant-numeric:tabular-nums}
.cal .h{color:var(--muted);font-weight:600}
.cal button{border:1px solid transparent;border-radius:6px;padding:4px 0;cursor:pointer;line-height:1.15}
.cal button small{display:block;font-size:9.5px;opacity:.85}
.cal .g{background:var(--good-soft);color:var(--good)}.cal .a{background:var(--warn-soft);color:var(--warn)}.cal .r{background:var(--coral-soft);color:var(--coral)}.cal .x2{background:var(--line);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.cal .pick{outline:2px solid var(--ocean)}
.chat{display:grid;gap:8px;max-height:340px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px}
.msg.me{justify-self:end;background:var(--ocean);color:var(--surface);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{justify-self:center;font-size:12.5px;color:var(--muted);background:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
tbody th{font-weight:600;font-size:13px;white-space:nowrap}
tr:last-child td,tr:last-child th{border-bottom:0}
.heat td{padding:0;text-align:center;font-size:11px;min-width:34px}
.heat td span{display:block;padding:6px 2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;font-family:var(--display);font-size:26px;line-height:1.15}
.kpi span.label{font-family:var(--body);font-size:11.5px;line-height:1.35;margin-bottom:4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ocean)}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.board .mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/10}
.board .mosaic img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.board .mosaic img:first-child{grid-row:1/3}
.board .b{padding:10px 12px}
.inq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.status{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sand);color:var(--sand-ink);white-space:nowrap}
.stack{display:grid;gap:14px}
footer.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.ok-t{color:var(--good);font-weight:600}.bad-t{color:var(--coral);font-weight:600}
.big{font-family:var(--display);font-size:clamp(36px,6vw,54px);line-height:1}
</style>
